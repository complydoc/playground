[project]
name = "complydoc-playground"
version = "0.0.0"
description = "Examples of complydoc from the command line and from Python, on LangChain pipelines."
requires-python = ">=3.11"
dependencies = [
    "complydoc[notebook]>=0.6.2",
    "docling>=2.131.0",
    "langchain-community>=0.3",
    "langchain-docling>=3.0.0",
    "langchain-opendataloader-pdf>=2.0.0",
    "langchain-pymupdf4llm>=0.4",
    "langchain-text-splitters>=0.3",
    "pdfplumber>=0.11",
    "pypdf>=5",
    "pytest>=8",
]

[tool.uv]
package = false

# The checks an editor shows: basedpyright's own default also flags every unused return
# value, which a script calling `write_json` for its side effect is full of.
[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
